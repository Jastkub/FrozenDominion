pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    // JDK 21 for the build is provisioned by Gradle (the machine has 17 and runtimes only)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'FrozenDominionSpells-1.21.1'
