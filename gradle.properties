## Mod Properties
mod_id=frozen_dominion
# THE JAR'S NAME, AND ONLY THE JAR'S NAME.
# Deliberately separate from mod_id. mod_id is baked into every resource
# location, every registry entry and every chunk that has ever contained one
# of these entities - renaming it renames the mod as far as saved worlds are
# concerned and orphans all of it. What goes on the file is a label.
mod_file_name=Frozen_Dominion
mod_name=Frozen Dominion
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.jastkub.frozenfortress
mod_authors=Jastkub
mod_description=The Frozen Fortress: a colossal endgame dungeon hidden in the eternal snow, home of frost servants and Velkhar, the Hollow Sovereign - a three-phase soulslike boss.
