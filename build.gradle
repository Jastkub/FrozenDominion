plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_file_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // GeckoLib ships SRG-named mixin refmaps; remap them for the
            // official-mappings dev runtime.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// (05.10.2026) one mixin of our own: other structures give way to the citadel (StructureStartMixin)
mixin {
    add sourceSets.main, 'frozen_dominion.refmap.json'
    config 'frozen_dominion.mixins.json'
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup("top.theillusivec4.curios")
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    // Curios is a hard dependency: the artifacts are built around its slots.
    // The full jar (not the :api classifier) so the dev runtime has it too.
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    // JEI's API, only to compile the Frost Anvil's tab against (integration/jei): the jar the instance already has,
    // copied into libs/ - nothing fetched; JEI itself is not in the dev runtime, so the plugin is never loaded there
    compileOnly files('libs/jei-1.20.1-forge-15.56.0.205.jar')
    // PlayerAnimator, for the legendary weapons' own player animations (07.10.2026): the instance's jar (it comes with
    // Better Combat), compile-only - every use of it sits behind ModList.isLoaded("playeranimator") in classes of their
    // own, so without it the weapons still work, only without their body animations
    compileOnly files('libs/player-animation-lib-forge-1.0.2-rc1+1.20.jar')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'frozen_dominion.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
